name: CI / Verification Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  c-engine-tests:
    name: C99 Scheduling Engine & Strict Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build C Engine with Strict Compiler Flags (-Wall -Wextra -Wpedantic -std=c99)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c99 -Isrc \
            src/core/process.c src/core/metrics.c src/core/simulation.c \
            src/schedulers/fcfs.c src/schedulers/sjf.c src/schedulers/srtf.c \
            src/schedulers/priority.c src/schedulers/round_robin.c \
            main.c -o scheduler_cli
          ./scheduler_cli --help

      - name: Compile and Run C Unit Tests
        run: |
          mkdir -p tests/bin
          gcc -Wall -Wextra -Wpedantic -std=c99 -Isrc \
            src/core/process.c src/core/metrics.c src/core/simulation.c \
            src/schedulers/fcfs.c src/schedulers/sjf.c src/schedulers/srtf.c \
            src/schedulers/priority.c src/schedulers/round_robin.c \
            tests/test_metrics.c -o tests/bin/test_metrics
          gcc -Wall -Wextra -Wpedantic -std=c99 -Isrc \
            src/core/process.c src/core/metrics.c src/core/simulation.c \
            src/schedulers/fcfs.c src/schedulers/sjf.c src/schedulers/srtf.c \
            src/schedulers/priority.c src/schedulers/round_robin.c \
            tests/test_simulation.c -o tests/bin/test_simulation
          ./tests/bin/test_metrics
          ./tests/bin/test_simulation

  python-backend-tests:
    name: Backend, Recommender, Traces & Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile C engine binary
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c99 -Isrc \
            src/core/process.c src/core/metrics.c src/core/simulation.c \
            src/schedulers/fcfs.c src/schedulers/sjf.c src/schedulers/srtf.c \
            src/schedulers/priority.c src/schedulers/round_robin.c \
            main.c -o scheduler_cli

      - name: Run Pytest Suite with Coverage
        run: pytest --cov=backend backend/tests

      - name: Run End-to-End Scenario Verification
        run: python test_e2e_scenario.py

      - name: Verify Experiment Matrix Pipeline (--quick mode)
        run: python backend/run_final_experiments.py --quick

  frontend-tests:
    name: Frontend React / TypeScript / Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Oxlint linter
        run: npm run lint

      - name: Run Vitest Unit & Integration Test Suite
        run: npm test

      - name: Build Production Frontend Assets
        run: npm run build
